      - '.github/workflows/alpine.yml'
      - '.github/workflows/check-actions-updates.yml'
      - '.github/workflows/check-release-ready.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/coverity.yml'
      - '.github/workflows/devcontainer.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/docker-release.yml'
      - '.github/workflows/dragonflybsd.yml'
      - '.github/workflows/freebsd.yml'
      - '.github/workflows/gcc.yml'
      - '.github/workflows/irc.yml'
      - '.github/workflows/kali.yml'
      - '.github/workflows/linux.yml'
      - '.github/workflows/linux-pcre.yml'
      - '.github/workflows/macos.yml'
      - '.github/workflows/manual.yml'
      - '.github/workflows/markdown-link.yml'
      - '.github/workflows/netbsd.yml'
      - '.github/workflows/pvs-studio.yml'
      - '.github/workflows/scanbuild.yml'
      - '.github/workflows/style.yml'
      - '.github/workflows/windows.yml'
      - '.vscode/**'
      - '.devcontainer/**'
      - '.clang-format'
      - '.codespellrc'
      - '.editorconfig'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - 'AC_VERSION.in'
      - 'AUTHORS'
      - 'centos_autotools.sh'
      - 'ChangeLog'
      - 'docker_package_install.sh'
      - 'Dockerfile'
      - 'Dockerfile.release'
      - 'INSTALLING'
      - 'LICENSE'
      - 'LICENSE.OpenSSL'
      - 'README'
      - 'README.md'
      - 'SECURITY.md'
      - 'scripts/airmon-ng.*'

env:
  LANG: en_US.UTF-8
  TZ: UTC
  MAKE: gmake

jobs:
  openbsd:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - cc: clang
            cxx: clang++
        flags:
          - name: OpenSSL
            flags: ""

    name: OpenBSD ${{ matrix.compiler.cc }} using ${{ matrix.flags.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 750
          submodules: 'recursive'

      - name: Build with ${{ matrix.compiler.cc }} using ${{ matrix.flags.name }}
        id: build
        uses: vmactions/openbsd-vm@v1
        with:
          # Deliberately unpinned. OpenBSD only serves packages for the
          # releases it still supports, so pinning one guarantees the job dies
          # the day that release ages out — /pub/OpenBSD/7.6/packages/amd64/ is
          # already a 404 and took every pkg_add with it.
          #
          # The package list only names things that exist across the supported
          # releases and resolve to exactly one candidate:
          #   - llvm    dropped, ambiguous (19/20/21 in 7.9) and unnecessary,
          #             the run below builds with base clang
          #   - openssl dropped, ambiguous (3.5 and 4.0 in 7.9); base LibreSSL
          #             already provides /usr/include/openssl
          #   - pkgconf dropped, no longer packaged after 7.7 (it lives in base)
          # autoconf and automake are selected by branch (pkg_add(1):
          # "pkgname%branch"), not by version. The packages carry a revision
          # suffix - autoconf-2.71p0, automake-1.16.5p0 - so "autoconf-2.71" is
          # read as a complete pkgname, matches nothing and fails with "Can't
          # find". The branch form ignores the revision and keeps matching when
          # it is bumped. Branches match AUTOCONF_VERSION / AUTOMAKE_VERSION
          # exported in the run block below.
          envs: 'LANG TZ MAKE'
          usesh: true
          sync: rsync
          copyback: false
          prepare: |
            pkg_add git shtool libtool automake%1.16 autoconf%2.71 pcre2 sqlite3 gmake cmocka
          run: |
            export CC="clang"
            export CXX="clang++"
            alias nproc='sysctl -n hw.ncpu'
            CPUS=$(nproc)
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            export AUTOCONF_VERSION=2.71
            export AUTOMAKE_VERSION=1.16
            echo "::group::make distclean"
            make distclean || :
            echo "::endgroup::"
            echo "::group::autoreconf"
            autoreconf -vif
            echo "::endgroup::"
            echo "::group::configure"
            echo ">> Configure with $CC, $CXX, and ${{ matrix.flags.flags }}"
            ./configure --enable-maintainer-mode --with-experimental --without-opt || { cat config.log; exit 1; }
            echo "::endgroup::"
            echo "::group::build"
            echo ">> Build using ${CPUS} jobs"
            gmake -j ${CPUS}
            echo "::endgroup::"
            echo "::group::run tests"
            gmake -j ${CPUS} check || { find . -name 'test-suite.log' -exec cat {} ';' && exit 1; }
            echo "::endgroup::"
